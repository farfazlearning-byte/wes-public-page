<!doctype html>
<html lang="en" data-eye="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>WES Design Demos — Choose One</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=Catamaran:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; font-family: "Catamaran", system-ui, sans-serif; background: var(--chrome-bg); }
      h1, h2, h3, p { margin: 0; }
      button { font: inherit; cursor: pointer; }

      /* ---------- Page chrome (switcher bar) ---------- */
      html[data-eye="light"] { --chrome-bg: #f4f6f8; --chrome-panel: #ffffff; --chrome-ink: #1d2733; --chrome-muted: #5d6d7e; --chrome-line: #dde4ec; --chrome-on: #146c43; }
      html[data-eye="dark"]  { --chrome-bg: #070b0e; --chrome-panel: #10181d; --chrome-ink: #eef4f6; --chrome-muted: #93a7b1; --chrome-line: #24333c; --chrome-on: #ffc94d; }
      html[data-eye="care"]  { --chrome-bg: #f3e9d2; --chrome-panel: #fff8e7; --chrome-ink: #4a3a20; --chrome-muted: #8a744c; --chrome-line: #e2d0a4; --chrome-on: #a8741a; }

      .topbar {
        position: sticky; top: 0; z-index: 50;
        background: var(--chrome-panel);
        border-bottom: 1px solid var(--chrome-line);
        padding: 10px 14px 12px;
      }
      .topbar-inner { max-width: 1080px; margin: 0 auto; }
      .topbar-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .topbar-title h1 { font-size: 17px; font-weight: 700; color: var(--chrome-ink); letter-spacing: .01em; }
      .topbar-title h1 .ta { color: var(--chrome-muted); font-weight: 600; }
      .topbar-title p { font-size: 13px; color: var(--chrome-muted); }
      .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .tab {
        flex: 1 1 30%; min-height: 52px; padding: 8px 10px;
        display: flex; align-items: center; gap: 9px; text-align: left;
        background: transparent; color: var(--chrome-ink);
        border: 1.5px solid var(--chrome-line); border-radius: 14px;
        transition: border-color .2s, background .2s, transform .2s;
      }
      .tab .num {
        flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
        display: grid; place-items: center; font-weight: 800; font-size: 15px;
        border: 1.5px solid var(--chrome-line); color: var(--chrome-muted);
      }
      .tab .tname { font-weight: 700; font-size: 14.5px; line-height: 1.15; }
      .tab .tta { display: block; font-size: 12px; font-weight: 600; color: var(--chrome-muted); }
      .tab[aria-selected="true"] { border-color: var(--chrome-on); background: color-mix(in srgb, var(--chrome-on) 12%, transparent); }
      .tab[aria-selected="true"] .num { background: var(--chrome-on); border-color: var(--chrome-on); color: #10130c; }
      html[data-eye="light"] .tab[aria-selected="true"] .num { color: #fff; }
      .tab:active { transform: scale(.98); }

      .eyebar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .eyebar .eye-label { font-size: 13px; font-weight: 700; color: var(--chrome-muted); margin-right: 2px; }
      .eye-btn {
        min-height: 44px; padding: 8px 16px; border-radius: 999px;
        border: 1.5px solid var(--chrome-line); background: transparent; color: var(--chrome-ink);
        font-weight: 700; font-size: 14px;
      }
      .eye-btn .ta { font-weight: 600; color: var(--chrome-muted); font-size: 12.5px; }
      .eye-btn[aria-pressed="true"] { background: var(--chrome-ink); color: var(--chrome-panel); border-color: var(--chrome-ink); }
      .eye-btn[aria-pressed="true"] .ta { color: inherit; opacity: .75; }

      /* ---------- Shared demo scaffolding ---------- */
      .demo { display: none; background: var(--bg); color: var(--ink); font-family: var(--body-font); overflow: hidden; }
      .demo.active { display: block; animation: demoIn .45s ease both; }
      @keyframes demoIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .wrap { max-width: 1060px; margin: 0 auto; padding: 34px 18px 30px; position: relative; }
      .sec-head { margin: 40px 0 16px; }
      .sec-head h2 { font-family: var(--head-font); font-size: clamp(21px, 3.4vw, 28px); font-weight: 800; line-height: 1.2; }
      .sec-head h2 .ta { color: var(--accent); }
      .sec-head p { color: var(--muted); font-size: 15.5px; margin-top: 4px; max-width: 56ch; }

      /* Hero / brand */
      .hero { text-align: center; padding: 14px 0 6px; position: relative; }
      .hero .brandline { font-family: var(--head-font); font-weight: 800; line-height: 1.14; font-size: clamp(27px, 5.6vw, 46px); letter-spacing: .005em; }
      .hero .brandline .gold { color: var(--accent); }
      .hero .brand-ta { margin-top: 10px; font-size: clamp(15px, 2.6vw, 19px); font-weight: 600; color: var(--muted); }
      .hero .welcome { margin: 14px auto 0; max-width: 58ch; font-size: 16px; line-height: 1.55; color: var(--muted); }
      .hero .welcome strong { color: var(--ink); }

      /* World map panel */
      .map-panel { margin-top: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(14px, 3vw, 26px); position: relative; }
      .map-panel .map-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
      .map-panel .map-top h2 { font-family: var(--head-font); font-size: clamp(19px, 3vw, 24px); font-weight: 800; }
      .map-panel .map-top h2 .ta { color: var(--accent); }
      .map-panel .map-top span { color: var(--muted); font-size: 14px; font-weight: 600; }
      .map-wrap { position: relative; }
      .map-svg { width: 100%; height: auto; display: block; }
      .map-svg .grat { stroke: var(--line); stroke-width: 1; opacity: .35; fill: none; }
      .map-svg .land { fill: var(--land); }
      .map-svg .glowdisc { fill: var(--accent2); opacity: .10; }
      .map-svg .journey { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 8; opacity: 0; stroke-linecap: round; }
      .pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; pointer-events: none; }
      .pin i { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 2.5px solid var(--panel); display: block; position: relative; flex: 0 0 auto; }
      .pin i::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--accent); opacity: .55; animation: pinPulse 2.6s ease-out infinite; }
      @keyframes pinPulse { 0% { transform: scale(.45); opacity: .7; } 70% { transform: scale(1.15); opacity: 0; } 100% { opacity: 0; } }
      .pin b { font-size: 12.5px; font-weight: 700; background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: 2.5px 9px; border-radius: 999px; white-space: nowrap; }
      .country-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .country-chips span { font-size: 14px; font-weight: 600; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 999px; background: var(--chip); }
      .country-chips span.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }

      /* Class cards */
      .classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 14px; }
      .class-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px 16px; position: relative; }
      .class-card .cc-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--chip); color: var(--accent); margin-bottom: 12px; }
      .class-card .cc-icon svg { width: 26px; height: 26px; }
      .class-card h3 { font-family: var(--head-font); font-size: 20px; font-weight: 800; line-height: 1.1; }
      .class-card .ta { color: var(--accent); font-weight: 700; font-size: 14.5px; margin-top: 2px; }
      .class-card .desc { color: var(--muted); font-size: 14.5px; line-height: 1.45; margin-top: 7px; }
      .class-card .go { margin-top: 13px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--accent); }
      .class-card .go svg { width: 15px; height: 15px; }

      /* Voices */
      .voices { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
      .voice-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; gap: 15px; align-items: center; }
      .voice-card .avatar { width: 58px; height: 58px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font-family: var(--head-font); font-weight: 800; font-size: 24px; background: var(--accent); color: var(--on-accent); }
      .voice-card.v2 .avatar { background: var(--accent2); }
      .voice-card h3 { font-family: var(--head-font); font-size: 20px; font-weight: 800; }
      .voice-card p { color: var(--muted); font-size: 14.5px; line-height: 1.4; }
      .play-btn { margin-left: auto; flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--chip); color: var(--accent); display: grid; place-items: center; }
      .play-btn svg { width: 20px; height: 20px; margin-left: 2px; }

      /* Launch + prices */
      .launch { margin-top: 40px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(22px, 4vw, 36px) 18px; position: relative; }
      .launch .l-kicker { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 12.5px; color: var(--accent); }
      .launch .l-kicker .ta { letter-spacing: 0; text-transform: none; font-size: 14px; }
      .launch h2 { font-family: var(--head-font); font-size: clamp(25px, 4.6vw, 38px); font-weight: 800; margin-top: 8px; line-height: 1.15; }
      .launch p { color: var(--muted); margin-top: 8px; font-size: 15.5px; }
      .prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 14px; }
      .price-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; text-align: center; }
      .price-card .p-name { font-weight: 700; font-size: 15px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
      .price-card .p-name .ta { text-transform: none; letter-spacing: 0; }
      .price-card .p-amt { font-family: var(--head-font); font-size: 34px; font-weight: 800; margin-top: 6px; }
      .price-card .p-amt small { font-size: 15px; font-weight: 600; color: var(--muted); font-family: var(--body-font); }
      .price-card .p-note { color: var(--muted); font-size: 14px; margin-top: 4px; }
      .design-tag { margin-top: 42px; text-align: center; font-family: var(--head-font); font-weight: 700; font-size: 15px; letter-spacing: .08em; color: var(--muted); }
      .design-tag::before, .design-tag::after { content: ""; display: inline-block; width: 42px; height: 1px; background: var(--line); vertical-align: middle; margin: 0 12px; }

      @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes spinSlow { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        html { scroll-behavior: auto; }
      }
    </style>
    <style>
      /* ================= DESIGN 1 — LIVING WORLD ================= */
      .demo-1 {
        --head-font: "Sora", sans-serif; --body-font: "Catamaran", sans-serif;
        --bg: #03130c; --panel: #082418; --card: #0a2c1c; --chip: #0f3d27;
        --ink: #f0f7ea; --muted: #a7c9ab; --accent: #ffc94d; --accent2: #3ddc84;
        --on-accent: #231a02; --line: rgba(255, 201, 77, .30); --land: #2f9e63; --radius: 22px;
        background:
          radial-gradient(720px 380px at 85% -60px, rgba(61, 220, 132, .20), transparent 65%),
          radial-gradient(620px 420px at 8% 30%, rgba(255, 201, 77, .10), transparent 60%),
          radial-gradient(900px 600px at 50% 115%, rgba(20, 120, 70, .22), transparent 65%),
          var(--bg);
      }
      html[data-eye="light"] .demo-1 { --bg: #e9f9ee; --panel: #ffffff; --card: #ffffff; --chip: #dcf3e2; --ink: #0d2b1a; --muted: #4c6f57; --accent: #d99a16; --accent2: #159a52; --on-accent: #ffffff; --line: #b9e4c6; --land: #35b06a; }
      html[data-eye="care"] .demo-1 { --bg: #f4ecd4; --panel: #fffaf0; --card: #fffaf0; --chip: #f1e3bc; --ink: #3e3420; --muted: #7d6c49; --accent: #b57f14; --accent2: #4d8a4f; --on-accent: #fff8e6; --line: #e0cd97; --land: #7fae62; }
      .demo-1 .hero .brandline { text-shadow: 0 0 34px rgba(61, 220, 132, .35); }
      .demo-1 .map-panel { box-shadow: 0 24px 60px rgba(0, 0, 0, .45), 0 0 0 1px rgba(61, 220, 132, .08), 0 0 44px rgba(61, 220, 132, .12); }
      .demo-1 .map-svg .journey { opacity: .85; }
      .demo-1 .class-card { box-shadow: 0 14px 30px rgba(0, 0, 0, .35); animation: floaty 7s ease-in-out infinite; }
      .demo-1 .class-card:nth-child(2) { animation-delay: -1.4s; }
      .demo-1 .class-card:nth-child(3) { animation-delay: -2.8s; }
      .demo-1 .class-card:nth-child(4) { animation-delay: -4.2s; }
      .demo-1 .class-card:nth-child(5) { animation-delay: -5.6s; }
      @media (min-width: 760px) {
        .demo-1 .class-card:nth-child(2) { margin-top: 18px; }
        .demo-1 .class-card:nth-child(4) { margin-top: 18px; }
      }
      .demo-1 .class-card .cc-icon { border-radius: 50%; }
      .demo-1 .voice-card, .demo-1 .price-card { box-shadow: 0 12px 26px rgba(0, 0, 0, .3); }
      .demo-1 .launch { background: linear-gradient(135deg, rgba(61, 220, 132, .14), rgba(255, 201, 77, .10)), var(--panel); }

      /* ================= DESIGN 2 — STORYBOOK CINEMA ================= */
      .demo-2 {
        --head-font: "Baloo Thambi 2", cursive; --body-font: "Catamaran", sans-serif;
        --bg: #062830; --panel: #0a3540; --card: #fdf6df; --chip: #f3e5bd;
        --ink: #fdf6e3; --muted: #b9d6cd; --accent: #f4b942; --accent2: #ff8c69;
        --on-accent: #2a1a02; --line: rgba(244, 185, 66, .45); --land: #3fa08a; --radius: 18px;
        background:
          radial-gradient(700px 360px at 50% -80px, rgba(244, 185, 66, .16), transparent 60%),
          radial-gradient(500px 500px at 100% 60%, rgba(255, 140, 105, .10), transparent 60%),
          var(--bg);
      }
      html[data-eye="light"] .demo-2 { --bg: #e7f3ee; --panel: #ffffff; --ink: #123c3a; --muted: #57766d; --line: #cfe3d8; --land: #4db294; }
      html[data-eye="care"] .demo-2 { --bg: #f6ecd2; --panel: #fffaf0; --ink: #44351d; --muted: #87754f; --accent: #c08c1d; --line: #e6d3a0; --land: #84ad72; }
      .demo-2 .film { position: relative; }
      .demo-2 .film::before, .demo-2 .film::after {
        content: ""; position: absolute; left: 10px; right: 10px; height: 12px; z-index: 2;
        background-image: radial-gradient(circle, var(--bg) 4.2px, transparent 4.8px);
        background-size: 24px 12px; background-repeat: repeat-x; opacity: .9;
      }
      .demo-2 .film::before { top: 5px; }
      .demo-2 .film::after { bottom: 5px; }
      .demo-2 .map-panel { border: 3px solid var(--accent); border-radius: 26px; box-shadow: 0 20px 44px rgba(0, 0, 0, .4); padding-top: 30px; padding-bottom: 30px; }
      .demo-2 .class-card { color: #2c2413; border: 2.5px solid #e9cf87; border-radius: 60px 60px 18px 18px; padding-top: 24px; box-shadow: 0 12px 24px rgba(0, 0, 0, .28); }
      .demo-2 .class-card h3 { color: #173f3a; }
      .demo-2 .class-card .ta { color: #c07f16; }
      .demo-2 .class-card .desc { color: #6d6046; }
      .demo-2 .class-card .cc-icon { background: #173f3a; color: #f4b942; border-radius: 50%; }
      .demo-2 .class-card .go { color: #c07f16; }
      .demo-2 .voice-card, .demo-2 .price-card { color: #2c2413; border: 2.5px solid #e9cf87; }
      .demo-2 .voice-card h3, .demo-2 .price-card .p-amt { color: #173f3a; }
      .demo-2 .voice-card p, .demo-2 .price-card .p-note, .demo-2 .price-card .p-amt small, .demo-2 .price-card .p-name { color: #6d6046; }
      .demo-2 .voice-card .avatar { color: #2a1a02; }
      .demo-2 .launch { border: 3px solid var(--accent); border-radius: 26px; background: radial-gradient(420px 200px at 50% 0%, rgba(244, 185, 66, .18), transparent 70%), var(--panel); }
      .demo-2 .hero .brandline { text-shadow: 0 3px 0 rgba(0, 0, 0, .25); }

      /* ================= DESIGN 3 — HOLOGRAM GRAND ================= */
      .demo-3 {
        --head-font: "Chakra Petch", sans-serif; --body-font: "Catamaran", sans-serif;
        --bg: #02070a; --panel: rgba(94, 245, 200, .05); --card: rgba(94, 245, 200, .055); --chip: rgba(94, 245, 200, .10);
        --ink: #eafff7; --muted: #8fb8ac; --accent: #5ff5c8; --accent2: #ffd166;
        --on-accent: #03231a; --line: rgba(94, 245, 200, .38); --land: #1f8f6e; --radius: 6px;
        background:
          linear-gradient(rgba(94, 245, 200, .045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(94, 245, 200, .045) 1px, transparent 1px),
          radial-gradient(760px 420px at 50% -60px, rgba(94, 245, 200, .13), transparent 62%),
          var(--bg);
        background-size: 44px 44px, 44px 44px, auto, auto;
      }
      html[data-eye="light"] .demo-3 { --bg: #edf7f3; --panel: #ffffff; --card: #ffffff; --chip: #ddf2e9; --ink: #0b2b24; --muted: #527066; --accent: #078a63; --accent2: #c08c1d; --on-accent: #ffffff; --line: #b7e2d2; --land: #3aa77f; }
      html[data-eye="care"] .demo-3 { --bg: #f5edd7; --panel: #fffaf0; --card: #fffaf0; --chip: #f0e2ba; --ink: #40351f; --muted: #7d6c49; --accent: #8a6d1f; --accent2: #b57f14; --on-accent: #fff8e6; --line: #ddc88f; --land: #8aa763; }
      .demo-3 .sec-head h2, .demo-3 .map-panel .map-top h2 { letter-spacing: .04em; text-transform: uppercase; font-size: clamp(18px, 2.8vw, 23px); }
      .demo-3 .hero .brandline { letter-spacing: .02em; text-shadow: 0 0 26px rgba(94, 245, 200, .45); }
      .demo-3 .map-panel, .demo-3 .class-card, .demo-3 .voice-card, .demo-3 .price-card, .demo-3 .launch {
        clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
        border: 1px solid var(--line);
        box-shadow: inset 0 0 32px rgba(94, 245, 200, .05), 0 0 22px rgba(94, 245, 200, .07);
        backdrop-filter: blur(3px);
      }
      .demo-3 .orbit { position: absolute; border: 1.5px dashed var(--line); border-radius: 50%; pointer-events: none; }
      .demo-3 .orbit.o1 { width: 118%; padding-top: 0; height: 132%; left: -9%; top: -16%; animation: spinSlow 46s linear infinite; }
      .demo-3 .orbit.o2 { width: 104%; height: 112%; left: -2%; top: -6%; border-style: solid; opacity: .5; animation: spinSlow 70s linear infinite reverse; }
      .demo-3 .class-card .cc-icon { border-radius: 4px; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
      .demo-3 .pin b { border-radius: 3px; letter-spacing: .05em; }
      .demo-3 .country-chips span { border-radius: 3px; letter-spacing: .04em; }
      .demo-3 .play-btn { border-radius: 6px; }
      .demo-3 .launch { background: radial-gradient(460px 220px at 50% 0%, rgba(255, 209, 102, .13), transparent 70%), var(--panel); }

      /* ================= DESIGN 4 — ROYAL PREMIUM ================= */
      .demo-4 {
        --head-font: "Playfair Display", serif; --body-font: "Catamaran", sans-serif;
        --bg: #faf6ec; --panel: #fffdf6; --card: #fffdf6; --chip: #f3ead2;
        --ink: #2b2118; --muted: #87765a; --accent: #a37f24; --accent2: #7c5c14;
        --on-accent: #fffaf0; --line: #ddc98f; --land: #b3a06a; --radius: 4px;
      }
      html[data-eye="dark"] .demo-4 { --bg: #16120d; --panel: #1f1a13; --card: #1f1a13; --chip: #2b2417; --ink: #f3ead6; --muted: #b3a586; --accent: #d9b45c; --accent2: #d9b45c; --line: #4a3f2a; --land: #6d5c33; }
      html[data-eye="care"] .demo-4 { --bg: #f7efdb; --ink: #46371f; --muted: #8a744c; --accent: #96700f; --line: #e0cd97; }
      .demo-4 .wrap { max-width: 880px; padding-top: 52px; }
      .demo-4 .hero .brandline { font-weight: 700; letter-spacing: .01em; }

    <style>

      .demo-3 .country-card { clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); border-radius: 0; box-shadow: 0 0 22px rgba(94, 245, 200, .10); }
      html[data-eye="light"] .demo-3 .country-card, html[data-eye="care"] .demo-3 .country-card { box-shadow: 0 10px 22px rgba(20, 40, 34, .14); }
      .demo-4 .country-card { outline: 1px solid var(--line); outline-offset: 3px; }

    </style>
    <style>
      /* ---------- Tap-to-zoom map journey (same flow, each design's own colours) ---------- */
      .crumb-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 10px; }
      .back-btn {
        min-height: 40px; padding: 7px 15px; border-radius: 999px; flex: 0 0 auto;
        border: 1.5px solid var(--line); background: var(--chip); color: var(--ink);
        font-weight: 700; font-size: 14px; transition: opacity .2s, transform .15s;
      }
      .back-btn:active { transform: scale(.96); }
      .back-btn[disabled] { opacity: .38; cursor: default; }
      .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
      .crumb-btn {
        background: none; border: none; padding: 7px 5px; min-height: 40px;
        color: var(--muted); font-weight: 700; font-size: 14.5px; border-radius: 8px;
      }
      .crumb-btn.current { color: var(--accent); }
      .crumb-sep { color: var(--muted); font-size: 13px; padding: 0 1px; }
      .zoom-stage { aspect-ratio: 2 / 1; }
      .zoom-view {
        position: absolute; inset: 0; opacity: 0; pointer-events: none;
        transform: scale(.93);
        transition: opacity .38s ease, transform .55s cubic-bezier(.25, .8, .3, 1);
      }
      .zoom-view.is-past { transform: scale(1.14); }
      .zoom-view.is-active { opacity: 1; transform: scale(1); pointer-events: auto; }
      .zoom-view[hidden] { display: none !important; }
      .zoom-view > div:first-child, .zoom-view > div:first-child svg { width: 100%; height: 100%; }
      .zoom-view svg text { font-family: var(--body-font); font-weight: 700; fill: var(--ink); }
      .zoom-view svg .st-label { font-size: 19px; }
      .zoom-view svg .st-small { font-size: 15.5px; fill: var(--muted); }
      .zoom-view svg .region { fill: var(--land); stroke: var(--line); stroke-width: 2; }
      .zoom-view svg .region-hl { fill: var(--accent); stroke: var(--line); stroke-width: 2; }
      .zoom-view svg .boundary { fill: none; stroke: var(--panel); stroke-width: 1.6; opacity: .55; }
      .zoom-view svg .citydot { fill: var(--panel); stroke: var(--accent); stroke-width: 2.5; }
      .zoom-view svg .sea-label { font-size: 16px; font-style: italic; fill: var(--muted); opacity: .85; }
      .pin-btn, .hotspot, .school-pin { pointer-events: auto; background: none; border: none; padding: 0; font: inherit; }
      .pin-btn { z-index: 3; }
      .pin-btn b, .hotspot b { transition: transform .15s; }
      .pin-btn:active b, .hotspot:active b { transform: scale(.94); }
      .hotspot { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; z-index: 3; }
      .hotspot i { width: 17px; height: 17px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); display: block; position: relative; flex: 0 0 auto; }
      .hotspot i::after { content: ""; position: absolute; inset: -11px; border-radius: 50%; border: 2px solid var(--accent); opacity: .55; animation: pinPulse 2.2s ease-out infinite; }
      .hotspot b { font-size: 13px; font-weight: 800; background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
      .area-label {
        position: absolute; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap;
        font-size: 12.5px; font-weight: 700; color: var(--ink);
        background: color-mix(in srgb, var(--panel) 85%, transparent);
        border: 1px solid var(--line); padding: 2.5px 9px; border-radius: 999px;
      }
      .school-pin { position: absolute; transform: translate(-50%, -50%); z-index: 3; width: 34px; height: 34px; display: grid; place-items: center; }
      .school-pin i { width: 16px; height: 16px; border-radius: 50%; background: var(--accent2); border: 3px solid var(--panel); display: block; position: relative; transition: transform .15s; }
      .school-pin i::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--accent2); opacity: .5; animation: pinPulse 2.6s ease-out infinite; }
      .school-pin:active i, .school-pin.picked i { transform: scale(1.3); background: var(--accent); }
      .school-card {
        position: absolute; left: 12px; bottom: 12px; z-index: 6; text-align: left;
        width: min(302px, calc(100% - 24px));
        background: var(--panel); color: var(--ink);
        border: 1.5px solid var(--accent); border-radius: calc(var(--radius) - 4px);
        padding: 14px 15px 13px; box-shadow: 0 18px 38px rgba(0, 0, 0, .35);
        animation: scIn .3s ease both;
      }
      @keyframes scIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .school-card .sc-tag { font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
      .school-card h4 { font-family: var(--head-font); font-size: 18.5px; font-weight: 800; line-height: 1.2; margin: 4px 26px 0 0; }
      .school-card .sc-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
      .school-card .sc-type { background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; }
      .school-card .sc-register {
        margin-top: 12px; width: 100%; min-height: 46px; border: none; border-radius: 10px;
        background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 15px;
      }
      .school-card .sc-register:active { transform: scale(.98); }
      .school-card .sc-note { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
      .school-card .sc-close {
        position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid var(--line); background: var(--chip); color: var(--ink); font-size: 17px; line-height: 1;
      }
      .country-chips button.chip {
        font: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--line);
        color: var(--ink); padding: 7px 14px; border-radius: 999px; background: var(--chip);
      }
      .country-chips button.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
      .demo-3 .country-chips button.chip, .demo-3 .hotspot b, .demo-3 .area-label { border-radius: 3px; letter-spacing: .04em; }
      .demo-3 .back-btn, .demo-3 .school-card .sc-register { border-radius: 4px; }
      .demo-4 .country-chips button.chip { border-radius: 2px; letter-spacing: .05em; }
      .demo-5 .country-chips button.chip, .demo-5 .area-label, .demo-5 .hotspot b { border-width: 2px; }
      .preview-note { margin-top: 10px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
      .pin-btn:focus-visible, .hotspot:focus-visible, .school-pin:focus-visible,
      .crumb-btn:focus-visible, .back-btn:focus-visible, .country-chips button.chip:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }

      /* ---------- Watercolor world — deep teal sea, every region its own vivid colour ---------- */
      .zoom-stage {
        background:
          radial-gradient(130% 120% at 50% -10%, rgba(64, 224, 255, .28), transparent 55%),
          radial-gradient(90% 90% at 82% 110%, rgba(23, 181, 165, .22), transparent 60%),
          linear-gradient(160deg, #0a5a74 0%, #063e55 42%, #032635 78%, #021a26 100%);
        box-shadow: inset 0 0 64px rgba(64, 224, 255, .16), inset 0 0 0 1px rgba(125, 230, 255, .18);
        border-radius: calc(var(--radius) - 4px);
        overflow: hidden;
      }
      .demo-3 .zoom-stage { border-radius: 2px; }
      .zoom-view svg text.c-label {
        fill: #14313d; font-size: 15px; font-weight: 800; letter-spacing: .02em;
        paint-order: stroke; stroke: rgba(255, 255, 255, .38); stroke-width: 2.6px; stroke-linejoin: round;
      }
      .zoom-view svg text.c-small {
        fill: #14313d; font-size: 11.5px; font-weight: 700;
        paint-order: stroke; stroke: rgba(255, 255, 255, .35); stroke-width: 2.2px; stroke-linejoin: round;
      }
      .zoom-view svg text.ocean-label {
        fill: #93e6f5; font-size: 13px; font-style: italic; font-weight: 600; letter-spacing: .16em; opacity: .85;
      }
      .zoom-view svg text.compass-t { fill: #a5eaf7; font-size: 11px; font-weight: 800; }
      .zoom-view svg text.sea-label { fill: #a5e9f7; }
      .zoom-view svg .st-label, .zoom-view svg .st-small {
        paint-order: stroke; stroke: rgba(6, 40, 54, .42); stroke-width: 3px; stroke-linejoin: round;
      }
      /* Modern infographic pins — teardrop markers with a soft shadow */
      .pin i {
        width: 17px; height: 17px; border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg); box-shadow: 0 3px 10px rgba(0, 25, 35, .45);
      }
      .pin b { box-shadow: 0 5px 16px rgba(0, 25, 35, .35); }
      .hotspot i {
        width: 19px; height: 19px; border-radius: 50% 50% 50% 0;

      .school-pin i {
        width: 17px; height: 17px; border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg); box-shadow: 0 3px 10px rgba(0, 25, 35, .45);
      }
      .school-pin:active i, .school-pin.picked i { transform: rotate(-45deg) scale(1.3); }
    </style>
    <style>
      /* ---------- Cascade region picker — beside the tappable map (Nexus entry method) ---------- */
      .map-grid { display: grid; grid-template-columns: minmax(0, 1fr) 302px; gap: 18px; align-items: start; }

      @media (max-width: 900px) { .map-grid { grid-template-columns: 1fr; } }
    </style>

            { v: "kochi", label: "Kochi · கொச்சி", en: "Kochi" },
            { v: "thiruvananthapuram", label: "Thiruvananthapuram · திருவனந்தபுரம்", en: "Thiruvananthapuram" },
            { v: "kozhikode", label: "Kozhikode · கோழிக்கோடு", en: "Kozhikode" }
          ] },
          karnataka: { label: "Karnataka · கர்நாடகா", en: "Karnataka", districts: [
            { v: "bengaluru", label: "Bengaluru · பெங்களூரு", en: "Bengaluru" },
            { v: "mysuru", label: "Mysuru · மைசூரு", en: "Mysuru" },
            { v: "mangaluru", label: "Mangaluru · மங்களூரு", en: "Mangaluru" }
          ] }
        } },
        canada: { en: "Canada", states: {
          ontario: { label: "Ontario · ஒன்டாரியோ", en: "Ontario", districts: [
            { v: "toronto", label: "Toronto · டொராண்டோ", en: "Toronto" },
            { v: "scarborough", label: "Scarborough · ஸ்கார்பரோ", en: "Scarborough" },
            { v: "ottawa", label: "Ottawa · ஒட்டாவா", en: "Ottawa" }
          ] },
          bc: { label: "British Columbia · பிரிட்டிஷ் கொலம்பியா", en: "British Columbia", districts: [
            { v: "vancouver", label: "Vancouver · வான்கூவர்", en: "Vancouver" },
            { v: "victoria", label: "Victoria · விக்டோரியா", en: "Victoria" },
            { v: "surrey", label: "Surrey · சர்ரே", en: "Surrey" }
          ] }
        } },
        china: { en: "China", states: {
          guangdong: { label: "Guangdong", en: "Guangdong", districts: [
            { v: "guangzhou", label: "Guangzhou", en: "Guangzhou" },
            { v: "shenzhen", label: "Shenzhen", en: "Shenzhen" }
          ] },
          beijing: { label: "Beijing", en: "Beijing", districts: [
            { v: "beijing-city", label: "Beijing city", en: "Beijing city" }
          ] },
          shanghai: { label: "Shanghai", en: "Shanghai", districts: [
            { v: "shanghai-city", label: "Shanghai city", en: "Shanghai city" }
          ] },
          sichuan: { label: "Sichuan", en: "Sichuan", districts: [
            { v: "chengdu", label: "Chengdu", en: "Chengdu" }
          ] },
          yunnan: { label: "Yunnan", en: "Yunnan", districts: [
            { v: "kunming", label: "Kunming", en: "Kunming" }
          ] }
        } },
        other: { en: "Other countries", states: {
          general: { label: "General region · பொது பகுதி", en: "General region", districts: [
            { v: "general-town", label: "General town · பொது ஊர்", en: "General town" }
          ] }
        } }
      };
      var VILLAGE_LABELS = { mallipattinam: "Mallipattinam", kollukadu: "Kollukadu" };
      document.querySelectorAll(".map-panel").forEach(function (panel) {
        var views = Array.prototype.slice.call(panel.querySelectorAll(".zoom-view"));
        var backBtn = panel.querySelector("[data-back]");
        var crumbs = panel.querySelector(".crumbs");
        var hint = panel.querySelector(".map-hint-top");
        var card = panel.querySelector(".school-card");
        var level = 0;
        var trail = ["World"];
        var trailLevels = [0];
        function renderCrumbs() {
          var html = "";
          for (var i = 0; i < trail.length; i++) {
            if (i > 0) html += '<span class="crumb-sep" aria-hidden="true">&#8250;</span>';
            var isLast = i === trail.length - 1;
            html += '<button type="button" class="crumb-btn' + (isLast ? " current" : "") + '" data-go="' + trailLevels[i] + '" data-crumb="' + i + '"' + (isLast ? ' aria-current="true"' : "") + '>' + trail[i] + '</button>';
          }
          crumbs.innerHTML = html;
        }
        function go(n, newTrail, newTrailLevels) {
          if (n < 0 || n > 3) return;
          if (n === level) {
            if (newTrail) { trail = newTrail; trailLevels = newTrailLevels; }
            backBtn.disabled = trail.length <= 1;
            renderCrumbs();
            return;
          }
          var from = level;
          level = n;
          if (newTrail) { trail = newTrail; trailLevels = newTrailLevels; }
          else { trail = LV_NAMES.slice(0, n + 1); trailLevels = trail.map(function (_, i) { return i; }); }
          views.forEach(function (v, i) {
            if (v._hideTimer) { clearTimeout(v._hideTimer); v._hideTimer = null; }
            if (i === n) {
              v.hidden = false;
              void v.offsetWidth;
              v.classList.add("is-active");
              v.classList.remove("is-past");
            } else {
              v.classList.remove("is-active");
              v.classList.toggle("is-past", i < n);
              v._hideTimer = setTimeout(function () { if (!v.classList.contains("is-active")) v.hidden = true; }, 580);
            }
            if (i === from || i === n) v.style.transformOrigin = LV_ORIGIN[Math.min(from, n)] || "50% 50%";
          });
          backBtn.disabled = trail.length <= 1;
          hint.textContent = LV_HINTS[n];
          if (n !== 3 && card) card.hidden = true;
          renderCrumbs();
          var rect = panel.getBoundingClientRect();
          if (rect.top < 130 || rect.bottom > window.innerHeight) {
            panel.scrollIntoView({ block: "center", behavior: "smooth" });
          }
        }
        /* --- Cascade picker wiring --- */
        var pkCountry = panel.querySelector(".pk-country");
        var pkState = panel.querySelector(".pk-state");
        var pkDistrict = panel.querySelector(".pk-district");
        var pkVillageWrap = panel.querySelector(".pk-village-wrap");
        var pkVillage = panel.querySelector(".pk-village");
        var pkStatus = panel.querySelector(".picker-status");
        var pkGo = panel.querySelector("[data-picker-go]");
        function fillStates() {
          var c = REGION_DATA[pkCountry.value];
          pkState.innerHTML = Object.keys(c.states).map(function (k) {
            return '<option value="' + k + '">' + c.states[k].label + '</option>';
          }).join("");
          fillDistricts();
        }
        function fillDistricts() {
          var c = REGION_DATA[pkCountry.value];
          var s = c.states[pkState.value];
          if (!s) { pkDistrict.innerHTML = ""; return; }
          pkDistrict.innerHTML = s.districts.map(function (d) {
            return '<option value="' + d.v + '">' + d.label + '</option>';
          }).join("");
          updateVillage();
        }
        function updateVillage() {
          var show = pkDistrict.value === "thanjavur";
          pkVillageWrap.hidden = !show;
          if (!show) pkVillage.value = "";
        }
        if (pkCountry) {
          pkCountry.addEventListener("change", fillStates);
          pkState.addEventListener("change", fillDistricts);
          pkDistrict.addEventListener("change", updateVillage);
          fillStates();
          pkGo.addEventListener("click", function () {
            var cKey = pkCountry.value;
            var c = REGION_DATA[cKey];
            var s = c.states[pkState.value];
            var d = s ? s.districts.filter(function (x) { return x.v === pkDistrict.value; })[0] : null;
            var villageEn = pkVillage && !pkVillageWrap.hidden && pkVillage.value ? VILLAGE_LABELS[pkVillage.value] : null;
            var isIndia = cKey === "india";
            var isTN = isIndia && pkState.value === "tn";
            var isChennai = isTN && d && d.v === "chennai";
            var newTrail = ["World", c.en];
            var newLevels = [0, isIndia ? 1 : 0];
            if (s) { newTrail.push(s.en); newLevels.push(isTN ? 2 : (isIndia ? 1 : 0)); }
            if (d) { newTrail.push(d.en); newLevels.push(isChennai ? 3 : (isTN ? 2 : (isIndia ? 1 : 0))); }
            if (villageEn) { newTrail.push(villageEn); newLevels.push(2); }
            var target = newLevels[newLevels.length - 1];
            go(target, newTrail, newLevels);
            var chosen = newTrail.slice(1).join(" › ");
            var exact = isChennai || (isTN && !d) || (isIndia && !s) || (newTrail.length === 2 && isIndia);
            if (isChennai) {
              hint.textContent = LV_HINTS[3];
              pkStatus.innerHTML = "You are inside <strong>" + chosen + "</strong> — tap a school pin on the map.";
            } else if (exact) {
              pkStatus.innerHTML = "You are inside <strong>" + chosen + "</strong>.";
            } else {
              hint.textContent = "Showing " + LV_NAMES[target] + " — " + newTrail[newTrail.length - 1] + " chosen";
              pkStatus.innerHTML = "Showing the <strong>" + LV_NAMES[target] + "</strong> map — <strong>" + chosen + "</strong> opens fully in the app.";
            }
          });
        }
        renderCrumbs();
        panel.addEventListener("click", function (e) {
          var schoolBtn = e.target.closest("[data-school]");
          if (schoolBtn) {
            var s = SCHOOLS[parseInt(schoolBtn.getAttribute("data-school"), 10)];
            panel.querySelectorAll(".school-pin").forEach(function (p) { p.classList.toggle("picked", p === schoolBtn); });
            card.querySelector(".sc-name").textContent = s.name;
            card.querySelector(".sc-type").textContent = s.type;
            card.querySelector(".sc-area").textContent = s.area + ", Chennai";
            card.querySelector(".sc-note").hidden = true;
            card.hidden = false;
            return;
          }
          if (e.target.closest("[data-close]")) { card.hidden = true; return; }
          if (e.target.closest("[data-register]")) { card.querySelector(".sc-note").hidden = false; return; }
          if (e.target.closest("[data-back]")) {
            if (trail.length > 1) {
              var bt = trail.slice(0, -1);
              var bl = trailLevels.slice(0, -1);
              go(bl[bl.length - 1], bt, bl);
              if (pkStatus) pkStatus.textContent = "";
            } else { go(level - 1); }
            return;
          }
          var goBtn = e.target.closest("[data-go]");
          if (goBtn) {
            var ci = goBtn.getAttribute("data-crumb");
            if (ci !== null && ci !== undefined) {
              var ti = parseInt(ci, 10);
              go(trailLevels[ti], trail.slice(0, ti + 1), trailLevels.slice(0, ti + 1));
            } else {
              go(parseInt(goBtn.getAttribute("data-go"), 10));
            }
            if (pkStatus && !goBtn.classList.contains("crumb-btn")) pkStatus.textContent = "";
          }
        });
      });

      /* ---------- Design switcher + eye-comfort switch ---------- */
      var root = document.documentElement;
      var tabs = document.querySelectorAll(".tab");
      var demos = document.querySelectorAll(".demo");
      var eyeBtns = document.querySelectorAll(".eye-btn");
      function setEye(mode) {
        root.setAttribute("data-eye", mode);
        eyeBtns.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-eye") === mode ? "true" : "false"); });
      }
      function showDesign(n) {
        tabs.forEach(function (t) { t.setAttribute("aria-selected", t.getAttribute("data-design") === String(n) ? "true" : "false"); });
        demos.forEach(function (d, i) { d.classList.toggle("active", i === n - 1); });
        setEye(demos[n - 1].getAttribute("data-natural"));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      tabs.forEach(function (t) {
        t.addEventListener("click", function () { showDesign(parseInt(t.getAttribute("data-design"), 10)); });
      });
      eyeBtns.forEach(function (b) {
        b.addEventListener("click", function () { setEye(b.getAttribute("data-eye")); });
      });
    </script>
  </body>
</html>
